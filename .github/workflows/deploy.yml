name: Deploy to GitHub Pages

# 触发条件：每次往 main 分支推送代码时自动构建并发布
# 也可以到 GitHub 的 Actions 页面手动点一次「Run workflow」
on:
  push:
    branches: [main]
  workflow_dispatch:

# 发布到 GitHub Pages 需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包
        # 纯前端 Demo：不需要任何环境变量或 Secret，直接打包即可。
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传打包产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
